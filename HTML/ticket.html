

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Coding Conf - Registration</title>
   <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <header>
        <nav>
            <h2>Coding Conf</h2>
        </nav>
    </header>

    <main>
        <section>
            <h1>Registration Form</h1>

            <p>Enter your details to register for Coding Conf 2026.</p>

            <form id="registrationForm">

                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="github">GitHub User Tag:</label>
                <input type="text" id="github" name="github" required>

                <label for="avatar">Upload Profile Picture:</label>
                <input type="file" id="avatar" name="avatar"
                accept=".jpg,.jpeg,.png" required>

                <button type="submit">Generate My Ticket</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Coding Conf 2026. All Rights Reserved.</p>
    </footer>

    <script src="../js/validation.js"></script>

</body>
</html>
